<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Beginning · September 4, 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blush: #f8cdd8;
        --rose: #e89ab0;
        --deep-rose: #c45c7a;
        --petal: #fff0f5;
        --cream: #fff8f4;
        --gold: #d4a017;
        --ink: #5a3040;
        --soft: #8a5a6a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family: "Cormorant Garamond", Georgia, serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse at top, #ffe4ec 0%, transparent 55%),
          radial-gradient(ellipse at bottom right, #fddde8 0%, transparent 50%),
          linear-gradient(180deg, #fff5f8 0%, var(--cream) 40%, #fde8ef 100%);
        overflow-x: hidden;
      }

      .petals,
      .sparkles {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }

      .petal {
        position: absolute;
        top: -40px;
        width: 14px;
        height: 18px;
        background: radial-gradient(circle at 30% 30%, #ffd6e3, #e89ab0);
        border-radius: 80% 0 80% 0;
        opacity: 0.7;
        animation: fall linear infinite;
      }

      .sparkle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 8px 2px rgba(255, 214, 232, 0.9);
        animation: twinkle ease-in-out infinite;
      }

      @keyframes fall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 0.75;
        }
        100% {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0;
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.6);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      .page {
        position: relative;
        z-index: 1;
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 24px 80px;
        text-align: center;
      }

      .date-header {
        margin-bottom: 16px;
      }

      h1 {
        font-family: "Great Vibes", cursive;
        font-size: clamp(3.1rem, 8vw, 5.6rem);
        font-weight: 400;
        line-height: 1.1;
        color: var(--deep-rose);
        text-shadow: 0 8px 24px rgba(196, 92, 122, 0.18);
      }

      .subtitle {
        margin-top: 10px;
        font-size: clamp(1.2rem, 2.4vw, 1.55rem);
        font-style: italic;
        color: var(--soft);
      }

      .divider {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin: 28px auto 36px;
        color: var(--rose);
        font-size: 1.1rem;
      }

      .divider span:first-child,
      .divider span:last-child {
        width: 72px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--rose), transparent);
      }

      .frame-wrap {
        position: relative;
        display: inline-block;
        margin: 8px auto 36px;
      }

      .bow {
        position: absolute;
        top: -18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        font-size: 2rem;
        filter: drop-shadow(0 6px 10px rgba(196, 92, 122, 0.25));
      }

      .photo-frame {
        position: relative;
        padding: 16px 16px 52px;
        background: linear-gradient(180deg, #fff 0%, #fff7fa 100%);
        border-radius: 8px 8px 18px 18px;
        box-shadow:
          0 2px 0 rgba(255, 255, 255, 0.8) inset,
          0 24px 50px rgba(196, 92, 122, 0.22),
          0 0 0 1px rgba(232, 154, 176, 0.35);
        transform: rotate(-1.4deg);
        max-width: min(86vw, 420px);
      }

      .photo-frame::before,
      .photo-frame::after {
        content: "♡";
        position: absolute;
        color: var(--rose);
        font-size: 1.1rem;
        opacity: 0.8;
      }

      .photo-frame::before {
        top: 10px;
        left: 14px;
      }

      .photo-frame::after {
        top: 10px;
        right: 14px;
      }

      .photo-frame img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 4px;
        object-fit: cover;
      }

      .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 14px;
        font-family: "Great Vibes", cursive;
        font-size: 1.7rem;
        color: var(--deep-rose);
      }

      .date {
        font-family: "Playfair Display", serif;
        font-size: clamp(1.2rem, 2.8vw, 1.65rem);
        color: var(--deep-rose);
        letter-spacing: 0.04em;
      }

      .time {
        margin-top: 6px;
        font-size: 1.05rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold);
        font-family: "Playfair Display", serif;
      }

      @media (max-width: 640px) {
        .page {
          padding: 36px 16px 64px;
        }

        .photo-frame {
          transform: rotate(0);
          padding-bottom: 48px;
        }
      }
    </style>
  </head>
  <body>
    <div class="petals" aria-hidden="true"></div>
    <div class="sparkles" aria-hidden="true"></div>

    <main class="page">
      <div class="date-header">
        <p class="date">September 4, 2026</p>
        <p class="time">4:44 AM</p>
      </div>
      <h1>Happy beginning of our relationship</h1>
      <p class="subtitle">for a peaceful and calm life</p>

      <div class="divider" aria-hidden="true">
        <span></span>
        ✿
        <span></span>
      </div>

      <div class="frame-wrap">
        <div class="bow">🎀</div>
        <figure class="photo-frame">
          <img
            src="us.jpg"
            alt="Us together, laughing with silly glasses and mustaches"
          />
          <figcaption class="caption">us, right at the start</figcaption>
        </figure>
      </div>
    </main>

    <script>
      const petals = document.querySelector(".petals");
      const sparkles = document.querySelector(".sparkles");

      for (let i = 0; i < 22; i++) {
        const petal = document.createElement("span");
        petal.className = "petal";
        petal.style.left = Math.random() * 100 + "%";
        petal.style.animationDuration = 8 + Math.random() * 10 + "s";
        petal.style.animationDelay = Math.random() * 8 + "s";
        petal.style.transform = "scale(" + (0.6 + Math.random() * 0.8) + ")";
        petals.appendChild(petal);
      }

      for (let i = 0; i < 28; i++) {
        const sparkle = document.createElement("span");
        sparkle.className = "sparkle";
        sparkle.style.left = Math.random() * 100 + "%";
        sparkle.style.top = Math.random() * 100 + "%";
        sparkle.style.animationDuration = 1.8 + Math.random() * 2.4 + "s";
        sparkle.style.animationDelay = Math.random() * 3 + "s";
        sparkles.appendChild(sparkle);
      }
    </script>
  </body>
</html>
