<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>happy 24hrs · September 5, 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blush: #f8cdd8;
        --rose: #e89ab0;
        --deep-rose: #c45c7a;
        --cream: #fff8f4;
        --gold: #d4a017;
        --ink: #5a3040;
        --soft: #8a5a6a;
        --hot-pink: #ff69b4;
        --lavender: #e6b8ff;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family: "Cormorant Garamond", Georgia, serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 20%, #ffb6d9 0%, transparent 35%),
          radial-gradient(circle at 80% 10%, #ffd1f0 0%, transparent 30%),
          radial-gradient(circle at 60% 80%, #ffc8e8 0%, transparent 40%),
          linear-gradient(135deg, #fff0f8 0%, #ffe0f0 30%, #fff5fc 60%, #fde8ff 100%);
        overflow-x: hidden;
        animation: bg-shift 4s ease-in-out infinite alternate;
      }

      @keyframes bg-shift {
        0% {
          filter: hue-rotate(0deg);
        }
        100% {
          filter: hue-rotate(18deg);
        }
      }

      .petals,
      .sparkles,
      .cat-party {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }

      .cat-party {
        z-index: 2;
      }

      .petal {
        position: absolute;
        top: -40px;
        width: 14px;
        height: 18px;
        background: radial-gradient(circle at 30% 30%, #ffd6e3, #e89ab0);
        border-radius: 80% 0 80% 0;
        opacity: 0.7;
        animation: fall linear infinite;
      }

      .sparkle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 8px 2px rgba(255, 214, 232, 0.9);
        animation: twinkle ease-in-out infinite;
      }

      .cat-gif {
        position: absolute;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(196, 92, 122, 0.35);
        border: 3px solid #fff;
        object-fit: cover;
        pointer-events: none;
        transform: translate(-50%, -50%);
        animation: cat-dance ease-in-out infinite;
        will-change: transform;
      }

      .cat-gif.drift-a {
        animation: drift-a linear infinite;
      }

      .cat-gif.drift-b {
        animation: drift-b linear infinite;
      }

      .cat-gif.drift-c {
        animation: drift-c ease-in-out infinite;
      }

      .cat-gif.pop-in {
        animation: pop-in 0.5s ease-out, cat-dance ease-in-out 0.9s infinite 0.5s;
      }

      @keyframes fall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 0;
        }
        10% {
          opacity: 0.75;
        }
        100% {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0;
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.6);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      @keyframes cat-dance {
        0%,
        100% {
          transform: translate(-50%, -50%) rotate(-12deg) scale(1);
        }
        25% {
          transform: translate(-50%, -58%) rotate(10deg) scale(1.08);
        }
        50% {
          transform: translate(-50%, -44%) rotate(-14deg) scale(0.94);
        }
        75% {
          transform: translate(-50%, -54%) rotate(16deg) scale(1.06);
        }
      }

      @keyframes drift-a {
        0% {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        25% {
          transform: translate(calc(-50% + 28px), calc(-50% - 22px)) rotate(8deg);
        }
        50% {
          transform: translate(calc(-50% - 18px), calc(-50% + 16px)) rotate(-10deg);
        }
        75% {
          transform: translate(calc(-50% + 12px), calc(-50% + 26px)) rotate(6deg);
        }
        100% {
          transform: translate(-50%, -50%) rotate(0deg);
        }
      }

      @keyframes drift-b {
        0% {
          transform: translate(-50%, -50%) rotate(-6deg) scale(1);
        }
        33% {
          transform: translate(calc(-50% - 34px), calc(-50% - 12px)) rotate(12deg) scale(1.05);
        }
        66% {
          transform: translate(calc(-50% + 24px), calc(-50% + 20px)) rotate(-14deg) scale(0.96);
        }
        100% {
          transform: translate(-50%, -50%) rotate(-6deg) scale(1);
        }
      }

      @keyframes drift-c {
        0%,
        100% {
          transform: translate(-50%, -50%) rotate(8deg);
        }
        50% {
          transform: translate(calc(-50% + 20px), calc(-50% - 30px)) rotate(-12deg);
        }
      }

      @keyframes pop-in {
        0% {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.2) rotate(-30deg);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1) rotate(0deg);
        }
      }

      @keyframes wiggle {
        0%,
        100% {
          transform: rotate(-2deg) scale(1);
        }
        50% {
          transform: rotate(2deg) scale(1.03);
        }
      }

      @keyframes bounce-text {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-6px) scale(1.04);
        }
      }

      @keyframes rainbow {
        0% {
          color: #c45c7a;
        }
        33% {
          color: #ff69b4;
        }
        66% {
          color: #d4a017;
        }
        100% {
          color: #c45c7a;
        }
      }

      .page {
        position: relative;
        z-index: 3;
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 24px 80px;
        text-align: center;
      }

      .date-header {
        margin-bottom: 16px;
        animation: wiggle 1.2s ease-in-out infinite;
      }

      h1 {
        font-family: "Great Vibes", cursive;
        font-size: clamp(3.1rem, 8vw, 5.6rem);
        font-weight: 400;
        line-height: 1.1;
        color: var(--deep-rose);
        text-shadow: 0 8px 24px rgba(196, 92, 122, 0.18);
        animation: rainbow 2.5s linear infinite;
      }

      .happy-24 {
        margin-top: 8px;
        font-family: "Great Vibes", cursive;
        font-size: clamp(2.4rem, 6vw, 4rem);
        color: var(--hot-pink);
        text-shadow: 2px 2px 0 #fff, 0 0 20px rgba(255, 105, 180, 0.6);
        animation: bounce-text 0.8s ease-in-out infinite;
      }

      .subtitle {
        margin-top: 10px;
        font-size: clamp(1.2rem, 2.4vw, 1.55rem);
        font-style: italic;
        color: var(--soft);
      }

      .chaos-banner {
        margin: 18px auto 0;
        font-family: "Playfair Display", serif;
        font-size: 1rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--deep-rose);
        animation: wiggle 0.6s ease-in-out infinite;
      }

      .divider {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin: 28px auto 36px;
        color: var(--rose);
        font-size: 1.4rem;
        animation: bounce-text 1s ease-in-out infinite;
      }

      .divider span:first-child,
      .divider span:last-child {
        width: 72px;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--rose), transparent);
      }

      .frame-wrap {
        position: relative;
        display: inline-block;
        margin: 8px auto 36px;
        animation: wiggle 2s ease-in-out infinite;
      }

      .bow {
        position: absolute;
        top: -18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        font-size: 2rem;
        filter: drop-shadow(0 6px 10px rgba(196, 92, 122, 0.25));
        animation: bounce-text 0.7s ease-in-out infinite;
      }

      .photo-frame {
        position: relative;
        padding: 16px 16px 52px;
        background: linear-gradient(180deg, #fff 0%, #fff7fa 100%);
        border-radius: 8px 8px 18px 18px;
        box-shadow:
          0 2px 0 rgba(255, 255, 255, 0.8) inset,
          0 24px 50px rgba(196, 92, 122, 0.22),
          0 0 0 1px rgba(232, 154, 176, 0.35);
        transform: rotate(-1.4deg);
        max-width: min(86vw, 420px);
      }

      .photo-frame::before,
      .photo-frame::after {
        content: "🐱";
        position: absolute;
        font-size: 1.3rem;
        opacity: 0.9;
        animation: bounce-text 0.9s ease-in-out infinite;
      }

      .photo-frame::before {
        top: 10px;
        left: 14px;
      }

      .photo-frame::after {
        content: "🦆";
        top: 10px;
        right: 14px;
      }

      .photo-frame img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 4px;
        object-fit: cover;
      }

      .caption {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 14px;
        font-family: "Great Vibes", cursive;
        font-size: 1.7rem;
        color: var(--deep-rose);
      }

      .date {
        font-family: "Playfair Display", serif;
        font-size: clamp(1.2rem, 2.8vw, 1.65rem);
        color: var(--deep-rose);
        letter-spacing: 0.04em;
      }

      .time {
        margin-top: 6px;
        font-size: 1.05rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gold);
        font-family: "Playfair Display", serif;
      }

      .cat-row {
        display: none;
      }

      @media (max-width: 640px) {
        .page {
          padding: 36px 16px 64px;
        }

        .photo-frame {
          transform: rotate(0);
          padding-bottom: 48px;
        }

        .cat-gif {
          opacity: 0.85;
        }
      }
    </style>
  </head>
  <body>
    <div class="petals" aria-hidden="true"></div>
    <div class="sparkles" aria-hidden="true"></div>
    <div class="cat-party" aria-hidden="true" id="cat-party"></div>

    <main class="page">
      <div class="date-header">
        <p class="date">September 5, 2026</p>
        <p class="time">4:44 AM</p>
      </div>
      <h1>Happy beginning of our relationship</h1>
      <p class="happy-24">happy 24hrs!!!</p>
      <p class="subtitle">for a peaceful and calm life (but make it cats & ducks)</p>
      <p class="chaos-banner">🎀 one whole day of us 🐱🦆</p>

      <div class="divider" aria-hidden="true">
        <span></span>
        🐱🦆✿🦆🐱
        <span></span>
      </div>

      <div class="frame-wrap">
        <div class="bow">🎀</div>
        <figure class="photo-frame">
          <img
            src="us.jpg"
            alt="Us together, laughing with silly glasses and mustaches"
          />
          <figcaption class="caption">us + 24hrs of love</figcaption>
        </figure>
      </div>

      <div class="cat-row" aria-hidden="true" id="sticker-row"></div>
    </main>

    <script>
      const petals = document.querySelector(".petals");
      const sparkles = document.querySelector(".sparkles");
      const catParty = document.getElementById("cat-party");

      const catStickers = [
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3UzbmU0NjgwaTB0d2d3N3E4aHd1NTBzbW8zeWtlZmhmNXNwdWlheCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/J8pIanYqwfgZulHkiA/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3UzbmU0NjgwaTB0d2d3N3E4aHd1NTBzbW8zeWtlZmhmNXNwdWlheCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/xcIlI0798VgnPYUQwj/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3UzbmU0NjgwaTB0d2d3N3E4aHd1NTBzbW8zeWtlZmhmNXNwdWlheCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/uN8sSLW5BLRG03nGUj/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3UzbmU0NjgwaTB0d2d3N3E4aHd1NTBzbW8zeWtlZmhmNXNwdWlheCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/pV0RpkmUZ5UB2/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3UzbmU0NjgwaTB0d2d3N3E4aHd1NTBzbW8zeWtlZmhmNXNwdWlheCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/iY25xIloX4bkwhcJJG/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3UzbmU0NjgwaTB0d2d3N3E4aHd1NTBzbW8zeWtlZmhmNXNwdWlheCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/FBTJHH4G7ols5Hj22D/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3UzbmU0NjgwaTB0d2d3N3E4aHd1NTBzbW8zeWtlZmhmNXNwdWlheCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/PGT5EHSnwpNaD2WtaR/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3UzbmU0NjgwaTB0d2d3N3E4aHd1NTBzbW8zeWtlZmhmNXNwdWlheCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/HsT6Y6dHDJXg67RA8A/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3UzbmU0NjgwaTB0d2d3N3E4aHd1NTBzbW8zeWtlZmhmNXNwdWlheCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/8jVNLzFZ1JBcYBeOr0/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3UzbmU0NjgwaTB0d2d3N3E4aHd1NTBzbW8zeWtlZmhmNXNwdWlheCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/kvrvnB158J4fm/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3UzbmU0NjgwaTB0d2d3N3E4aHd1NTBzbW8zeWtlZmhmNXNwdWlheCZlcD12MV9naWZzX3NlYXJjaCZjdD1n/6gSoPdYNSLILASEykJ/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjNoMTVhNmZsZzNlNXUzdWlhajB1aG5yZHdweXc2cHc2b3l6YXZ1NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/msBAKoAHINITC/giphy.gif",
      ];

      const duckStickers = [
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjNoMTVhNmZsZzNlNXUzdWlhajB1aG5yZHdweXc2cHc2b3l6YXZ1NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/8Bkqq19phBmRsZEVks/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjNoMTVhNmZsZzNlNXUzdWlhajB1aG5yZHdweXc2cHc2b3l6YXZ1NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/KY5itWvIINKs8/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjNoMTVhNmZsZzNlNXUzdWlhajB1aG5yZHdweXc2cHc2b3l6YXZ1NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/6N5xYcINzjEg8/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjNoMTVhNmZsZzNlNXUzdWlhajB1aG5yZHdweXc2cHc2b3l6YXZ1NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/q7N5ibuu03RciLizGw/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjNoMTVhNmZsZzNlNXUzdWlhajB1aG5yZHdweXc2cHc2b3l6YXZ1NyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/8cErh1JVriXOWlspLs/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3djVkOWU3YmNtdHptcXo2MHhwdGltY3NobHg1b2E1cXgwd2xvYXp5aiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/4ktDZ7RX9as4Shmrr6/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPWVjZjA1ZTQ3djVkOWU3YmNtdHptcXo2MHhwdGltY3NobHg1b2E1cXgwd2xvYXp5aiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/DtJAgycIRLK80/giphy.gif",
      ];

      const stickers = [];
      const maxLen = Math.max(catStickers.length, duckStickers.length);
      for (let i = 0; i < maxLen; i++) {
        if (catStickers[i]) stickers.push(catStickers[i]);
        if (duckStickers[i]) stickers.push(duckStickers[i]);
      }

      const placed = [];
      const driftClasses = ["drift-a", "drift-b", "drift-c", ""];
      const minGap = 11;

      function tooClose(left, top) {
        return placed.some((p) => {
          const dx = left - p.left;
          const dy = top - p.top;
          return Math.sqrt(dx * dx + dy * dy) < minGap;
        });
      }

      function randomSpot() {
        let left = 8 + Math.random() * 84;
        let top = 6 + Math.random() * 88;
        let tries = 0;
        while (tooClose(left, top) && tries < 40) {
          left = 4 + Math.random() * 92;
          top = 4 + Math.random() * 92;
          tries++;
        }
        placed.push({ left, top });
        return { left, top };
      }

      function addSticker(src, options = {}) {
        const img = document.createElement("img");
        img.className = "cat-gif";
        img.src = src;
        img.alt = "";

        const size = options.size || 55 + Math.random() * 95;
        const { left, top } = options.position || randomSpot();

        img.style.width = size + "px";
        img.style.height = size + "px";
        img.style.left = left + "%";
        img.style.top = top + "%";
        img.style.zIndex = String(1 + Math.floor(Math.random() * 4));
        img.style.opacity = String(0.82 + Math.random() * 0.18);
        img.style.animationDuration =
          (0.6 + Math.random() * 1.6) + "s, " + (2.8 + Math.random() * 4.5) + "s";
        img.style.animationDelay = Math.random() * 2.5 + "s";

        const drift = driftClasses[Math.floor(Math.random() * driftClasses.length)];
        if (drift) img.classList.add(drift);
        if (options.popIn) img.classList.add("pop-in");

        catParty.appendChild(img);
        return img;
      }

      for (let i = 0; i < 28; i++) {
        addSticker(stickers[i % stickers.length]);
      }

      function spawnFromEdge() {
        const edge = Math.floor(Math.random() * 4);
        let left;
        let top;

        if (edge === 0) {
          left = 2 + Math.random() * 96;
          top = -4 - Math.random() * 8;
        } else if (edge === 1) {
          left = 102 + Math.random() * 8;
          top = 8 + Math.random() * 84;
        } else if (edge === 2) {
          left = 2 + Math.random() * 96;
          top = 104 + Math.random() * 8;
        } else {
          left = -8 - Math.random() * 8;
          top = 8 + Math.random() * 84;
        }

        const img = addSticker(stickers[Math.floor(Math.random() * stickers.length)], {
          size: 50 + Math.random() * 75,
          position: { left, top },
          popIn: true,
        });

        const target = randomSpot();
        img.style.transition = "left 2.8s ease-out, top 2.8s ease-out, opacity 0.4s ease";
        requestAnimationFrame(() => {
          img.style.left = target.left + "%";
          img.style.top = target.top + "%";
        });

        setTimeout(() => {
          img.style.transition = "";
          setTimeout(() => img.remove(), 5000 + Math.random() * 4000);
        }, 3000);
      }

      function scheduleSpawn() {
        spawnFromEdge();
        setTimeout(scheduleSpawn, 900 + Math.random() * 700);
      }
      scheduleSpawn();

      for (let i = 0; i < 22; i++) {
        const petal = document.createElement("span");
        petal.className = "petal";
        petal.style.left = Math.random() * 100 + "%";
        petal.style.animationDuration = 8 + Math.random() * 10 + "s";
        petal.style.animationDelay = Math.random() * 8 + "s";
        petal.style.transform = "scale(" + (0.6 + Math.random() * 0.8) + ")";
        petals.appendChild(petal);
      }

      for (let i = 0; i < 28; i++) {
        const sparkle = document.createElement("span");
        sparkle.className = "sparkle";
        sparkle.style.left = Math.random() * 100 + "%";
        sparkle.style.top = Math.random() * 100 + "%";
        sparkle.style.animationDuration = 1.8 + Math.random() * 2.4 + "s";
        sparkle.style.animationDelay = Math.random() * 3 + "s";
        sparkles.appendChild(sparkle);
      }
    </script>
  </body>
</html>
